name: astroinn-blog
services:
  blog:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${BLOG_BIND:-127.0.0.1}:${BLOG_PORT:-8080}:80"
    volumes:
      - ./data:/srv/blog:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
