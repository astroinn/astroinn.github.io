server {
    listen 80;
    server_name _;
    root /srv/blog/current;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    open_file_cache off;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    location ~ /\. {
        deny all;
    }
}
